apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: init-data-and-profiles
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Setting up data directories..."
              mkdir -p /app/data/artifacts /app/data/repos /app/data/profiles
              chmod -R 777 /app/data

              echo "Checking profiles.yml..."
              if [ ! -f /app/data/profiles/profiles.yml ]; then
                echo "profiles.yml not found, copying from ConfigMap..."
                cp /profiles-template/profiles.yml /app/data/profiles/profiles.yml
                chmod 666 /app/data/profiles/profiles.yml
                echo "profiles.yml initialized from Helm values."
              else
                echo "profiles.yml exists, preserving existing file."
              fi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: profiles-config
              mountPath: /profiles-template
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- if .Values.dbtAdapters }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting uvicorn..."
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          {{- end }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-backend-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbt-workbench.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbt-workbench.secretName" . }}
                  key: JWT_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: profiles-config
          configMap:
            name: {{ .Release.Name }}-profiles


