# This workflow:
#   - lints the chart
#   - validates templates render correctly
#   - releases a new chart version if the version has been bumped
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

# Cancel previous PR builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1
      - name: Lint chart
        run: ct lint --charts=dbt/chart --validate-maintainers=false

  changes:
    runs-on: ubuntu-latest
    name: changed dbt-workbench files
    outputs:
      chart-changed: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v6
      - name: Get changed related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            chart:
              - 'dbt/chart/**'
              - '.helmignore'
              - '.github/**'
              - '.gitignore'

  template:
    runs-on: ubuntu-latest
    name: template chart
    needs: [changes]
    if: ${{needs.changes.outputs.chart-changed == 'true'}}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Template chart
        run: |
          helm template test-release dbt/chart

  # Everything above is CI, everything here and below is for releases and runs only on non-pull-request events
  sync-readme:
    needs: [lint, template]
    runs-on: ubuntu-latest
    if: ${{ always() && !failure() && github.event_name != 'pull_request'}}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          path: main
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
      - name: Copy README files from main to gh-pages
        run: |
          cd main
          # Copy chart README to gh-pages
          cp --parents dbt/chart/README.md ../gh-pages/ 2>/dev/null || true
          cp --parents dbt/chart/INSTALLATION_GUIDE.md ../gh-pages/ 2>/dev/null || true
      - name: Commit changes to gh-pages and push
        run: |
          cd gh-pages
          git add .
          git config user.name "GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # Commit only if changes exist to avoid failure in this step
          git diff-index --quiet HEAD || git commit --signoff -m "Sync READMEs from main"
          git push

  release:
    needs: [lint, template, sync-readme]
    runs-on: ubuntu-latest
    if: ${{ always() && !failure() && github.event_name != 'pull_request'}}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Release charts
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          # If we didn't bump the chart version then we can skip the release
